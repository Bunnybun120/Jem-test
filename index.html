<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bunny.exe</title>

<link rel="stylesheet" href="style.css">

<link
id="themeStylesheet"
rel="stylesheet"
href="themes/rosalina.css"
>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&family=VT323&family=Quicksand:wght@400;700&family=Great+Vibes&display=swap"
rel="stylesheet"
>

</head>

<body class="theme-rosalina">

<!-- ===================================== -->
<!-- BACKGROUND -->
<!-- ===================================== -->

<div id="background">

<div class="bg-layer bg-back"></div>
<div class="bg-layer bg-mid"></div>
<div class="bg-layer bg-front"></div>

<div class="particles"></div>

</div>

<!-- ===================================== -->
<!-- WORLD -->
<!-- ===================================== -->

<div class="world">

<!-- ===================================== -->
<!-- LOGO -->
<!-- ===================================== -->

<div class="logo">

Bunny.exe

</div>

<!-- ===================================== -->
<!-- MAIN SCENE -->
<!-- ===================================== -->

<section class="scene">

<div class="environment"></div>

<!-- ===================================== -->
<!-- NAVIGATION -->
<!-- ===================================== -->

<a class="world-link music-link" href="music.html">

<span>Music Lounge</span>

</a>

<a class="world-link games-link" href="games.html">

<span>Arcade Nexus</span>

</a>

<a class="world-link shows-link" href="shows.html">

<span>Media Theater</span>

</a>

<a class="world-link fandoms-link" href="fandoms.html">

<span>Shrine Hall</span>

</a>

<a class="world-link blog-link" href="blog.html">

<span>Dream Journal</span>

</a>

<a class="world-link guestbook-link" href="guestbook.html">

<span>Visitor Terminal</span>

</a>

<a class="world-link chatroom-link" href="chatroom.html">

<span>Chatroom</span>

</a>

</section>

<!-- ===================================== -->
<!-- MUSIC PLAYER -->
<!-- ===================================== -->

<section class="music-player">

<div class="player-glow"></div>

<h2>

Now Playing

</h2>

<input
id="musicInput"
placeholder="paste spotify / soundcloud / youtube link"
>

<button id="loadMusic">

Load Music

</button>

<div class="music-status">

Waiting for transmission...

</div>

<audio
id="audioPlayer"
controls
style="display:none;"
></audio>

<iframe
id="musicFrame"
allow="autoplay"
allowfullscreen
></iframe>

</section>

<!-- ===================================== -->
<!-- PROFILE -->
<!-- ===================================== -->

<section class="profile-area">

<img
class="pfp"
src="https://i.imgur.com/8Km9tLL.gif"
>

<div class="profile-text">

<h2>

Bunny

</h2>

<p>

A drifting archive of games,
music,
anime,
internet aesthetics,
dream worlds,
and strange hyperfixations.

</p>

</div>

</section>

<!-- ===================================== -->
<!-- THEMES -->
<!-- ===================================== -->

<div class="theme-switcher">

<button data-theme="rosalina">

Rosalina

</button>

<button data-theme="aero">

Aero

</button>

<button data-theme="vaporwave">

Vaporwave

</button>

</div>

</div>

<script src="theme.js"></script>
<script src="music.js"></script>

</body>
</html>
