<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEM.EXE</title>

<!-- FONTS -->

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=VT323&family=Nunito:wght@400;700&display=swap"
rel="stylesheet">

<!-- CSS -->

<link
rel="stylesheet"
href="css/windows.css">

<link
id="themeStylesheet"
rel="stylesheet"
href="themes/vaporwave.css">

</head>

<body>

<!-- =========================================
THEME CONTAINER
========================================= -->

<div id="themeBackground"></div>

<!-- =========================================
TOPBAR
========================================= -->

<div class="topbar">

<div class="logo">

JEM.EXE

</div>

<div class="topbar-right">

<button onclick="setTheme('vaporwave')">

VAPOR

</button>

<button onclick="setTheme('aero')">

AERO

</button>

<button onclick="setTheme('rosalina')">

ROSALINA

</button>

<div id="clock"></div>

</div>

</div>

<!-- =========================================
DESKTOP ICONS
========================================= -->

<div class="desktop-icons">

<div
class="desktop-icon"
onclick="openWindow('aboutWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/747/747376.png">

<span>

ABOUT

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('musicWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png">

<span>

MUSIC

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('gamesWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/686/686589.png">

<span>

GAMES

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('showsWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/1179/1179069.png">

<span>

SHOWS

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('friendsWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">

<span>

FRIENDS

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('chatWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png">

<span>

CHATROOM

</span>

</div>

</div>

<!-- =========================================
ABOUT
========================================= -->

<div
class="app-window"
id="aboutWindow"
style="display:none;">

<div class="titlebar">

ABOUT.EXE

<button onclick="closeWindow('aboutWindow')">

✕

</button>

</div>

<div class="window-body">

<h1>

WELCOME TO JEM.EXE

</h1>

<p>

Retro desktop world.

</p>

</div>

</div>

<!-- =========================================
MUSIC
========================================= -->

<div
class="app-window"
id="musicWindow"
style="display:none;">

<div class="titlebar">

MUSIC.EXE

<button onclick="closeWindow('musicWindow')">

✕

</button>

</div>

<div class="window-body">

<div id="musicPlayer">

<img
id="albumArt"
src="https://i.imgur.com/8Km9tLL.png">

<div id="trackInfo">

<div id="trackTitle">

No Track

</div>

<div id="artistName">

Unknown Artist

</div>

</div>

<div class="player-controls">

<button id="playButton">

▶

</button>

<button id="pauseButton">

⏸

</button>

</div>

<div class="visualizer">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

</div>

</div>

</div>

<!-- =========================================
GAMES
========================================= -->

<div
class="app-window"
id="gamesWindow"
style="display:none;">

<div class="titlebar">

GAMES.EXE

<button onclick="closeWindow('gamesWindow')">

✕

</button>

</div>

<div class="window-body">

<h2>

GAME COLLECTION

</h2>

</div>

</div>

<!-- =========================================
SHOWS
========================================= -->

<div
class="app-window"
id="showsWindow"
style="display:none;">

<div class="titlebar">

SHOWS.EXE

<button onclick="closeWindow('showsWindow')">

✕

</button>

</div>

<div class="window-body">

<h2>

WATCHLIST

</h2>

</div>

</div>

<!-- =========================================
FRIENDS
========================================= -->

<div
class="app-window"
id="friendsWindow"
style="display:none;">

<div class="titlebar">

FRIENDS.EXE

<button onclick="closeWindow('friendsWindow')">

✕

</button>

</div>

<div class="window-body">

<h2>

FRIEND DIRECTORY

</h2>

</div>

</div>

<!-- =========================================
CHATROOM
========================================= -->

<div
class="app-window"
id="chatWindow"
style="display:none;">

<div class="titlebar">

💬 CHATROOM.EXE

<button onclick="closeWindow('chatWindow')">

✕

</button>

</div>

<div class="window-body chat-layout">

<!-- CHANNELS -->

<div class="chat-channels">

<button class="channel active">

# general

</button>

<button class="channel">

# music

</button>

<button class="channel">

# games

</button>

<button class="channel">

# anime

</button>

</div>

<!-- CHAT -->

<div class="chat-main">

<div id="chatMessages"></div>

<div id="typingIndicator"></div>

<div class="chat-input-row">

<input
id="chatInput"
placeholder="type message...">

<button id="sendMessage">

SEND

</button>

</div>

</div>

<!-- PROFILE -->

<div class="chat-profile">

<img
id="profilePreview"
src="https://i.imgur.com/8Km9tLL.png">

<input
id="usernameInput"
placeholder="username">

<input
id="pfpInput"
placeholder="paste image url">

<button id="saveProfile">

SAVE PROFILE

</button>

</div>

</div>

</div>

<!-- =========================================
TASKBAR
========================================= -->

<div class="taskbar">

<div>

JEM.EXE

</div>

<div id="taskbarClock"></div>

</div>

<!-- =========================================
AUDIO
========================================= -->

<audio id="audioPlayer">

<source
src="assets/music/song.mp3"
type="audio/mpeg">

</audio>

<!-- =========================================
JS
========================================= -->

<script src="js/windows.js"></script>
<script src="js/music.js"></script>
<script src="js/chat.js"></script>
<script src="js/themes.js"></script>

</body>

</html>
