<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEM.EXE</title>

<link
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script src="https://www.youtube.com/iframe_api"></script>

<script
defer
src="js/main.js">

</script>

</head>

<body>

<div id="youtubePlayer"></div>

<!-- BOOT -->

<div id="bootScreen">

<h1>
JEM.EXE
</h1>

<p>
booting desktop OS...
</p>

</div>

<!-- EFFECTS -->

<div class="vhs"></div>

<div class="stars"></div>

<div class="grid-floor"></div>

<div class="retro-sun"></div>

<!-- TOPBAR -->

<nav class="topbar">

<div class="logo">
✦ JEM.EXE ✦
</div>

<button id="themeButton">
THEMES
</button>

</nav>

<!-- DESKTOP -->

<section id="desktop">

</section>

<!-- TASKBAR -->

<div class="taskbar">

<div class="taskbar-start">
START
</div>

<div id="taskbarClock">
00:00
</div>

</div>

<!-- MUSIC PLAYER -->

<div id="musicPlayer">

<h3>
♫ SYSTEM PLAYER
</h3>

<div id="nowPlaying">
nothing playing
</div>

<input
id="musicURL"
placeholder="youtube link">

<button id="musicToggle">
PLAY
</button>

</div>

<!-- ADMIN PANEL -->

<div id="adminPanel">

<input
type="password"
id="adminPassword"
placeholder="password">

<button id="adminLogin">
LOGIN
</button>

</div>

</body>
</html>
