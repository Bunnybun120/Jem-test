<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEM OS</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="desktop">

  <!-- NAV -->
  <div class="topbar">
    <a class="back-home" href="index.html">HOME</a>
  </div>

  <!-- ABOUT WINDOW -->
  <div class="window draggable">
    <div class="titlebar">ABOUT ME</div>
    <div class="window-content">
      <p>Fill this in later...</p>
    </div>
  </div>

  <!-- CHAT WINDOW -->
  <div class="window draggable chat-window">

    <div class="titlebar">CHAT SYSTEM</div>

    <div class="window-content">

      <div id="chatStatus"></div>

      <div id="loginBox">
        <input id="nameInput" placeholder="username">
        <button id="joinBtn">join</button>
      </div>

      <div id="chatSystem" style="display:none;">

        <div id="userBar"></div>
        <div id="chatBox" class="chat-box"></div>
        <div id="typing"></div>

        <div class="chat-controls">
          <input id="chatInput" placeholder="message">
          <button id="chatSend">send</button>
        </div>

      </div>

    </div>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script defer src="js/main.js"></script>

</body>
</html>
