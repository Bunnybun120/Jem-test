<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>JEM.EXE</title>

<!-- =========================================
FONTS
========================================= -->

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=VT323&family=Nunito:wght@400;700&display=swap"
rel="stylesheet">

<!-- =========================================
CSS
========================================= -->

<link
rel="stylesheet"
href="css/windows.css">

<link
id="themeStylesheet"
rel="stylesheet"
href="themes/vaporwave.css">

</head>

<body>

<!-- =========================================
THEME BACKGROUND
========================================= -->

<div id="themeBackground"></div>

<!-- =========================================
TOPBAR
========================================= -->

<div class="topbar">

<div class="logo">

JEM.EXE

</div>

<div class="theme-buttons">

<button onclick="setTheme('vaporwave')">

VAPOR

</button>

<button onclick="setTheme('aero')">

AERO

</button>

<button onclick="setTheme('rosalina')">

ROSALINA

</button>

</div>

<div id="clock">

00:00

</div>

</div>

<!-- =========================================
DESKTOP
========================================= -->

<div class="desktop-icons">

<div
class="desktop-icon"
onclick="openWindow('aboutWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/747/747376.png">

<span>

ABOUT

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('musicWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/3659/3659898.png">

<span>

MUSIC

</span>

</div>

<div
class="desktop-icon"
onclick="openWindow('chatWindow')">

<img
src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png">

<span>

CHATROOM

</span>

</div>

</div>

<!-- =========================================
ABOUT WINDOW
========================================= -->

<div
class="app-window"
id="aboutWindow">

<div class="titlebar">

ABOUT.EXE

<button onclick="closeWindow('aboutWindow')">

✕

</button>

</div>

<div class="window-body">

<h1>

WELCOME TO JEM.EXE

</h1>

<p>

A nostalgic customizable desktop world.

</p>

</div>

</div>

<!-- =========================================
MUSIC WINDOW
========================================= -->

<div
class="app-window"
id="musicWindow">

<div class="titlebar">

MUSIC.EXE

<button onclick="closeWindow('musicWindow')">

✕

</button>

</div>

<div class="window-body">

<div id="musicPlayer">

<img
id="albumArt"
src="https://i.imgur.com/8Km9tLL.png">

<div id="trackTitle">

No Song Loaded

</div>

<div id="artistName">

Unknown Artist

</div>

<input
id="youtubeLink"
placeholder="paste youtube embed link">

<button id="loadSong">

LOAD SONG

</button>

<div id="youtubeContainer">

</div>

</div>

</div>

</div>

<!-- =========================================
CHATROOM WINDOW
========================================= -->

<div
class="app-window"
id="chatWindow">

<div class="titlebar">

CHATROOM.EXE

<button onclick="closeWindow('chatWindow')">

✕

</button>

</div>

<div class="window-body chat-layout">

<!-- SIDEBAR -->

<div class="chat-sidebar">

<div class="channel active">

# general

</div>

<div class="channel">

# music

</div>

<div class="channel">

# games

</div>

</div>

<!-- CHAT -->

<div class="chat-main">

<div id="chatMessages">

</div>

<div class="chat-input-row">

<input
id="chatInput"
placeholder="type message...">

<button id="sendMessage">

SEND

</button>

</div>

</div>

<!-- PROFILE -->

<div class="chat-profile">

<img
id="profilePreview"
src="https://i.imgur.com/8Km9tLL.png">

<input
id="usernameInput"
placeholder="username">

<input
id="pfpInput"
placeholder="pfp image link">

<button id="saveProfile">

SAVE

</button>

</div>

</div>

</div>

<!-- =========================================
JS
========================================= -->

<script src="js/windows.js"></script>
<script src="js/music.js"></script>
<script src="js/chat.js"></script>
<script src="js/themes.js"></script>

</body>

</html>
