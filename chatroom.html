========================= -->

<div class="desktop">

<div class="window draggable chatroom-window"
style="top:100px; left:60px; width:800px;">

<div class="titlebar">
CHATROOM.EXE v3
</div>

<div class="window-content">

<div class="chat-header">
✦ GLOBAL MULTIPLAYER CHAT ✦
</div>

<br>

<!-- USER SETTINGS -->

<input
id="usernameInput"
class="username-input"
placeholder="username..."
style="
width:100%;
margin-bottom:8px;
padding:8px;
background:#111;
color:white;
border:1px solid #ff4fd8;
">

<div style="margin-bottom:10px;">

<label>
TEXT COLOR →
</label>

<input
id="colorInput"
type="color"
value="#ff4fd8">

</div>

<!-- CHAT -->

<div id="chatBox"></div>

<div class="chat-controls">

<input
id="chatInput"
placeholder="type message...">

<button id="chatSend">
SEND
</button>

</div>

</div>
