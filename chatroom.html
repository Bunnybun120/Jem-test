<meta charset="UTF-8">

<link
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script defer src="js/main.js"></script>

</head>

<body>

<div class="stars"></div>

<div class="retro-sun"></div>

<nav class="topbar">

<div class="logo">
✦ JEM.EXE ✦
</div>

<div class="nav-links">

<section class="hero small-hero">

<h1>
💬 CHATROOM.EXE
</h1>

<p>
Realtime Retro Multiplayer Chat
</p>

</section>

<div class="chatroom-layout">

<!-- SIDEBAR -->

<div class="chat-sidebar">

<h2>
✦ PROFILE ✦
</h2>

<div class="profile-section">

<input
id="usernameInput"
placeholder="username...">

<input
id="pfpInput"
placeholder="profile picture url...">

<input
id="bioInput"
placeholder="status/bio...">

<label class="color-label">
TEXT COLOR
</label>

<input
id="colorInput"
type="color"
value="#ff4fd8">

</div>

<div class="sidebar-divider"></div>

<h2>
✦ SETTINGS ✦
</h2>

<div class="settings-buttons">

<button
id="archiveChat"
class="chat-btn">
ARCHIVE
</button>

<button
id="viewArchives"
class="chat-btn">
LOGS
</button>

<button
id="clearChat"
class="chat-btn danger-btn">
CLEAR
</button>

</div>

</div>

<!-- MAIN CHAT -->

<div class="chat-main">

<div id="chatBox"></div>

<div class="chat-input-bar">

<input
id="chatInput"
placeholder="type message...">

<button
id="chatSend"
class="chat-btn">
SEND
</button>

</div>

</div>

</div>

<!-- ARCHIVE MODAL -->

<div id="archiveModal">

<div class="archive-content">

<h1>
📁 ARCHIVED LOGS
</h1>

<div id="archiveList"></div>

<button id="closeArchives">
CLOSE
</button>

</div>

</div>

</body>
</html>
