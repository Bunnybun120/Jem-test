<div class="chat-header">
✦ GLOBAL CHATROOM ONLINE ✦
</div>

<input id="usernameInput" class="username-input" placeholder="username...">

<div class="chat-settings">

<input id="colorInput" type="color" value="#ff69b4">

<select id="colorPreset">
<option value="#ff69b4">hotpink</option>
<option value="#00ffff">cyan</option>
<option value="#b000ff">purple</option>
<option value="#00ff88">green</option>
<option value="#ffffff">white</option>
</select>

</div>

<div id="chatBox"></div>

<div class="chat-controls">

<input id="chatInput" placeholder="type message...">

<button id="chatSend">SEND</button>

</div>
