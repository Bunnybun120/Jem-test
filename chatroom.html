<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Chatroom</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="theme-vaporwave">

<div class="chatroom">

<div class="chat-sidebar">

<h2>

ONLINE

</h2>

<ul id="onlineUsers">

<li>Bunny</li>
<li>Dreaming.exe</li>
<li>starboy99</li>

</ul>

<button id="clearChat">

Clear Chat

</button>

<button id="archiveChat">

Archive Chat

</button>

</div>

<div class="chat-main">

<div id="messages">

<div class="message">

<span class="user">

Bunny:

</span>

Welcome to the dreamspace.

</div>

id="messageInput"
placeholder="type message..."
>

</select>

<button id="sendMessage">

Send

</button>

</div>

</div>

</div>

<script src="chatroom.js"></script>

</html>
